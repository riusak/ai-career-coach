<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- 3D Pyramid Base dashed back edge -->
  <line x1="92" y1="265" x2="310" y2="265" stroke="#94A3B8" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" />

  <!-- 3D Pyramid Edges (Solid dark navy) -->
  <line x1="200" y1="72" x2="92" y2="265" stroke="#0B1528" stroke-width="6.5" stroke-linecap="round" />
  <line x1="200" y1="72" x2="200" y2="310" stroke="#0B1528" stroke-width="6.5" stroke-linecap="round" />
  <line x1="200" y1="72" x2="310" y2="265" stroke="#0B1528" stroke-width="6.5" stroke-linecap="round" />
  <line x1="92" y1="265" x2="200" y2="310" stroke="#0B1528" stroke-width="6.5" stroke-linecap="round" />
  <line x1="200" y1="310" x2="310" y2="265" stroke="#0B1528" stroke-width="6.5" stroke-linecap="round" />

  <!-- Vertex Node Dots -->
  <circle cx="200" cy="72" r="10.5" fill="#0B1528" />
  <circle cx="92" cy="265" r="9.5" fill="#0B1528" />
  <circle cx="200" cy="310" r="10.5" fill="#0B1528" />
  <circle cx="310" cy="265" r="9.5" fill="#0B1528" />

  <!-- Ascending Bold Orange Zigzag Arrow Cutting Through Wireframe -->
  <path
    d="M 46 288 L 175 142 L 235 240 L 320 86"
    stroke="#FF7A00"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead at top-right -->
  <polygon
    points="360,45 295,72 322,112"
    fill="#FF7A00"
  />

  <!-- Orange rounded rectangle pill at bottom right -->
  <rect x="235" y="322" width="70" height="38" rx="12" fill="#FF7A00" />
</svg>
